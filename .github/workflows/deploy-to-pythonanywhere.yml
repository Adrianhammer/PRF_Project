name: Deploy to PythonAnywhere

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run tests
        run: |
          pytest

  deploy:
    name: deploy to PythonAnywhere
    runs-on: ubuntu-latest
    needs: test
    concurrency: production 
    env:
      API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
      PA_USERNAME: adrianhammer
      CONSOLE_ID: ${{ secrets.CONSOLE_ID }}

    steps:
      - name: Pull latest code
        run: |
          curl -f -X POST \
            -H "Authorization: Token $API_TOKEN" \
            --data-urlencode $'input=cd ~/PRF_Project && git pull\n' \
            "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/consoles/$CONSOLE_ID/send_input/"

      - name: Wait for git pull
        run: sleep 10

      - name: Reload web app
        run: |
          curl -f -X POST \
            -H "Authorization: Token $API_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/webapps/$PA_USERNAME.pythonanywhere.com/reload/"
